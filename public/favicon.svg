<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#dc2626"/>

  <!-- Car body - main silhouette -->
  <path d="M8 38 L10 32 L18 26 L24 22 L40 22 L46 26 L54 32 L56 38 L56 42 L8 42 Z" fill="#ffffff"/>

  <!-- Windshield -->
  <path d="M22 28 L26 23.5 L38 23.5 L42 28 Z" fill="#dc2626" opacity="0.85"/>

  <!-- Side windows -->
  <path d="M14 28 L18 24 L22 24 L19 28 Z" fill="#dc2626" opacity="0.7"/>
  <path d="M42 28 L45 24 L50 28 Z" fill="#dc2626" opacity="0.7"/>

  <!-- Car body lower detail line -->
  <path d="M8 38 L56 38" stroke="#dc2626" stroke-width="0.5" opacity="0.3"/>

  <!-- Front bumper / grille accent -->
  <rect x="22" y="38" width="20" height="3" rx="1" fill="#dc2626" opacity="0.4"/>

  <!-- Headlights -->
  <ellipse cx="13" cy="35" rx="3" ry="2" fill="#fef08a"/>
  <ellipse cx="51" cy="35" rx="3" ry="2" fill="#fef08a"/>

  <!-- Wheels -->
  <circle cx="20" cy="43" r="5.5" fill="#1f2937"/>
  <circle cx="20" cy="43" r="2.5" fill="#6b7280"/>
  <circle cx="44" cy="43" r="5.5" fill="#1f2937"/>
  <circle cx="44" cy="43" r="2.5" fill="#6b7280"/>

  <!-- Star detail (Chinese theme) top right -->
  <path d="M53 9 L54.2 12.6 L58 12.6 L55 14.8 L56.2 18.4 L53 16.2 L49.8 18.4 L51 14.8 L48 12.6 L51.8 12.6 Z" fill="#fef08a" opacity="0.9"/>
</svg>
